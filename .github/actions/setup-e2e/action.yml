name: 'Setup E2E Environment'
description: 'Shared setup for E2E test jobs: Node, npm install, Playwright browsers'

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
      with:
        node-version: 22
    - name: Reconfigure git to use HTTP authentication
      shell: bash
      run: >
        git config --global url."https://github.com/".insteadOf
        ssh://git@github.com/

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: |
        echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

    - uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
      id: npm-cache
      with:
        path: ${{ steps.npm-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-node22-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node22-

    # npm i runs Prisma's postinstall, which downloads engine binaries from a
    # CDN; a transient ECONNRESET there fails the whole job. Retry to absorb it.
    - name: Install npm Packages
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 10
        max_attempts: 3
        retry_wait_seconds: 20
        command: npm i

    - name: Cache Playwright Browsers
      uses: actions/cache@8b402f58fbc84540c8b491a91e594a4576fec3d7 # v5
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

    # Playwright's system dependency installer shells out to apt via sudo. Do not
    # wrap it in an action-level timeout: killing the root child from the runner
    # user can fail with EPERM. Prefer the canonical Ubuntu mirror when the hosted
    # runner points at a slow Azure mirror, then let apt retry stalled transfers.
    - name: Configure apt reliability for Playwright
      shell: bash
      run: |
        while IFS= read -r source_file; do
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source_file"
        done < <(
          grep -rl 'azure.archive.ubuntu.com' \
            /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true
        )

        sudo tee /etc/apt/apt.conf.d/99-playwright-ci >/dev/null <<'EOF'
        Acquire::Retries "5";
        Acquire::http::Timeout "30";
        Acquire::https::Timeout "30";
        Acquire::ForceIPv4 "true";
        EOF

    - name: Install Playwright Dependencies
      shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2; do
          echo "Playwright dependency install attempt ${attempt}/2"
          if npx playwright install-deps chromium; then
            exit 0
          fi
          status=$?
          if [ "$attempt" -eq 2 ]; then
            exit "$status"
          fi
          sleep 10
        done

    # Browser downloads do not elevate to root, so the retry action can safely
    # enforce a timeout here without hitting the sudo/EPERM process-tree issue.
    - name: Install Playwright Browser
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
      with:
        timeout_minutes: 5
        max_attempts: 2
        retry_wait_seconds: 10
        command: npx playwright install chromium
