name: LifeOS Final Template Fix

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/lifeos-final-template-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/lifeos-native-ui-unification'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Fix final Angular template issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          settings = Path('src/app/pages/life-settings-page/life-settings-page.component.ts')
          text = settings.read_text(encoding='utf-8')
          old = '[value]="String(config().weeklyReviewDay)"'
          new = '[value]="numberValue(config().weeklyReviewDay)"'
          if old not in text:
              raise SystemExit('weeklyReviewDay String expression not found')
          settings.write_text(text.replace(old, new, 1), encoding='utf-8')

          picker = Path('src/app/features/lifeos/life-field-picker.component.ts')
          text = picker.read_text(encoding='utf-8')
          old = '''        @if (selectedOptions()[0]; as selected) {
          <mat-icon
            class="leading-icon"
            [class.dot-icon]="selected.icon === 'circle'"
            [style.color]="selected.color || null"
            >{{ selected.icon || defaultIcon() }}</mat-icon
          >
          <span class="picker-value">{{ selected.label }}</span>
          @if (multiple() && selectedOptions().length > 1) {
            <span class="more-count">+{{ selectedOptions().length - 1 }}</span>
          }
        } @else {
          <mat-icon class="leading-icon">{{ defaultIcon() }}</mat-icon>
          <span class="picker-value muted">{{ emptyLabel() }}</span>
        }
        <mat-icon class="chevron">arrow_drop_down</mat-icon>'''
          new = '''        <span class="picker-content">
          @if (selectedOptions()[0]; as selected) {
            <mat-icon
              class="leading-icon"
              [class.dot-icon]="selected.icon === 'circle'"
              [style.color]="selected.color || null"
              >{{ selected.icon || defaultIcon() }}</mat-icon
            >
            <span class="picker-value">{{ selected.label }}</span>
            @if (multiple() && selectedOptions().length > 1) {
              <span class="more-count">+{{ selectedOptions().length - 1 }}</span>
            }
          } @else {
            <mat-icon class="leading-icon">{{ defaultIcon() }}</mat-icon>
            <span class="picker-value muted">{{ emptyLabel() }}</span>
          }
          <mat-icon class="chevron">arrow_drop_down</mat-icon>
        </span>'''
          if old not in text:
              raise SystemExit('picker projection block not found')
          text = text.replace(old, new, 1)
          marker = '''      .leading-icon {
        flex: 0 0 auto;'''
          css = '''      .picker-content {
        display: flex;
        align-items: center;
        width: 100%;
        min-width: 0;
      }

      .leading-icon {
        flex: 0 0 auto;'''
          if marker not in text:
              raise SystemExit('picker css marker not found')
          picker.write_text(text.replace(marker, css, 1), encoding='utf-8')
          PY
          npx --yes prettier@3.6.2 --write \
            src/app/pages/life-settings-page/life-settings-page.component.ts \
            src/app/features/lifeos/life-field-picker.component.ts
          git diff --check
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/app/pages/life-settings-page/life-settings-page.component.ts \
            src/app/features/lifeos/life-field-picker.component.ts
          git commit --no-verify -m 'fix(lifeos): finalize native picker templates'
          git push --no-verify origin HEAD:${{ github.event.pull_request.head.ref }}
