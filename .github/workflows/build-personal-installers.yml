name: Build Personal Installers

on:
  push:
    branches:
      - agent/native-goals-mobile-sync
    paths:
      - .github/workflows/build-personal-installers.yml

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Install npm packages
        run: npm i
      - name: Build Android debug APK
        run: npm run dist:android
      - name: Upload Android APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifeos-native-android-debug
          path: android/app/build/outputs/apk/**/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build
      - name: Install npm packages
        shell: bash
        run: npm install @nx/nx-win32-x64-msvc && npm i
      - name: Build frontend and Electron
        run: npm run buildAllElectron:noTests:prod
      - name: Package Windows installer
        run: npx electron-builder --win
      - name: Upload Windows installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lifeos-native-windows
          path: .tmp/app-builds/*.exe
