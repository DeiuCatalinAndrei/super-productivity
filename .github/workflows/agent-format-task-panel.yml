name: Agent Format Task Panel
on:
  push:
    branches:
      - fix/lifeos-duplicate-repeat
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[agent-format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/lifeos-duplicate-repeat
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - run: npm i
      - run: npx prettier --write src/app/features/tasks/task-detail-panel/task-detail-panel.component.html
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/tasks/task-detail-panel/task-detail-panel.component.html
          git commit -m "Format task panel template [agent-format]"
          git push origin HEAD:fix/lifeos-duplicate-repeat
