name: Cleanup Goals Lockfile

on:
  push:
    branches:
      - agent/native-goals-mobile-sync
    paths:
      - .github/workflows/cleanup-goals-lockfile.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: agent/native-goals-mobile-sync
          fetch-depth: 0
      - name: Restore lockfile from master and remove helper
        shell: bash
        run: |
          git fetch origin master
          git checkout origin/master -- package-lock.json
          rm .github/workflows/cleanup-goals-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          HUSKY=0 git commit -m "chore(goals): remove unrelated lockfile drift"
          HUSKY=0 git push origin HEAD:agent/native-goals-mobile-sync
