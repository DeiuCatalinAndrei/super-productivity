name: Agent Fix Task Panel Formatting
on:
  push:
    branches:
      - fix/lifeos-duplicate-repeat
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[agent-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/lifeos-duplicate-repeat
      - name: Apply deterministic Prettier fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/features/tasks/task-detail-panel/task-detail-panel.component.html')
          s = p.read_text()
          old = '''  <div class="panel-field-help">\n    Planned for is when you intend to work on this task.\n  </div>'''
          new = '''  <div class="panel-field-help">Planned for is when you intend to work on this task.</div>'''
          if old not in s:
              raise SystemExit('Expected Planned for helper fragment not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/tasks/task-detail-panel/task-detail-panel.component.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: format task panel helper [agent-fix]"
          git push origin HEAD:fix/lifeos-duplicate-repeat
