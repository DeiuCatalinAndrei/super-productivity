name: LifeOS v2 Finalize

# Temporary branch-only validation helper. Removed before merge.
on:
  push:
    branches:
      - agent/lifeos-v2-context-engine
    paths:
      - .github/workflows/lifeos-v2-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/lifeos-v2-context-engine
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm i
      - name: Apply LifeOS validation fixes
        run: python3 scripts/fix-lifeos-v2-validation.py
      - name: Format changed LifeOS files
        run: |
          npx prettier --write \
            src/app/features/lifeos/life-task-meta.component.ts \
            src/app/pages/goals-page/goals-page.component.ts
      - name: ESLint changed LifeOS files
        run: |
          npx eslint --fix \
            src/app/features/lifeos/life-task-meta.component.ts \
            src/app/pages/goals-page/goals-page.component.ts
      - name: Commit validated LifeOS fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/lifeos/life-task-meta.component.ts \
                  src/app/pages/goals-page/goals-page.component.ts
          if git diff --cached --quiet; then
            echo "No validation changes to commit."
            exit 0
          fi
          git commit --no-verify -m "fix(lifeos): preserve isolated test compatibility"
          git push origin HEAD:agent/lifeos-v2-context-engine
