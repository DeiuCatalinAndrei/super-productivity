name: Finalize Native Goals

on:
  push:
    branches:
      - agent/native-goals-mobile-sync

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: agent/native-goals-mobile-sync
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22

      - name: Apply completion patch
        run: node tools/finalize-native-goals-patch.cjs

      - name: Install npm packages
        run: npm i

      - name: Format and lint touched files
        run: |
          npx prettier --write src/app/pages/goals-page/goals-page.component.ts e2e/tests/sync/supersync-goals.spec.ts
          npx eslint src/app/pages/goals-page/goals-page.component.ts e2e/tests/sync/supersync-goals.spec.ts

      - name: Commit final source patch
        shell: bash
        run: |
          rm .github/workflows/finalize-native-goals.yml tools/finalize-native-goals-patch.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(goals): finalize and reopen synced objectives"
          git push origin HEAD:agent/native-goals-mobile-sync
