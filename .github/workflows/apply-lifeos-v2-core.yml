name: Apply LifeOS v2 Core

on:
  push:
    branches:
      - agent/lifeos-v2-context-engine
    paths:
      - scripts/apply-lifeos-v2-core.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/lifeos-v2-context-engine
      - name: Apply core model patch
        run: python3 scripts/apply-lifeos-v2-core.py
      - name: Commit generated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/features/config/global-config.model.ts \
                  src/app/features/config/default-global-config.const.ts \
                  src/app/features/tasks/task.model.ts \
                  src/app/features/project/project.model.ts \
                  src/app/features/tasks/task.service.ts
          if git diff --cached --quiet; then
            echo "No source changes generated."
            exit 0
          fi
          git commit --no-verify -m "feat(lifeos): sync task intelligence and context metadata"
          git push origin HEAD:agent/lifeos-v2-context-engine
