name: Format Goals

on:
  push:
    branches:
      - agent/native-goals-mobile-sync
    paths:
      - 'src/app/pages/goals-page/goals-page.component.ts'
      - '.github/workflows/format-goals.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/native-goals-mobile-sync
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Format Goals page
        run: npx --yes prettier@3.6.2 --write src/app/pages/goals-page/goals-page.component.ts
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/goals-page/goals-page.component.ts
          git commit -m "style(goals): apply prettier formatting"
          git push origin HEAD:agent/native-goals-mobile-sync
