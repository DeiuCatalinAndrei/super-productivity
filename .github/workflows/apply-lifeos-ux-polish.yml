name: Apply LifeOS UX Polish

on:
  push:
    branches:
      - agent/lifeos-ux-polish-final
    paths:
      - '.github/workflows/apply-lifeos-ux-polish.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/lifeos-ux-polish-final
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python tools/apply-lifeos-ux-polish.py
      - name: Remove patch scaffolding
        run: rm tools/apply-lifeos-ux-polish.py .github/workflows/apply-lifeos-ux-polish.yml
      - name: Commit implementation
        run: |
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/app/features/simple-counter/habit-tracker/habit-tracker.component.ts \
            src/app/pages/goals-page/goals-page.component.ts \
            src/app/pages/life-today-page/life-today-page.component.ts \
            src/app/app.routes.ts \
            src/app/core-ui/magic-side-nav/magic-nav-config.service.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.html \
            src/app/features/tasks/add-task-bar/add-task-bar.component.scss \
            tools/apply-lifeos-ux-polish.py \
            .github/workflows/apply-lifeos-ux-polish.yml
          git commit -m 'feat(lifeos): polish task capture and interactions'
          git push origin HEAD:agent/lifeos-ux-polish-final
