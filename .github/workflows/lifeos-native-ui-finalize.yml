name: Finalize LifeOS Native UI

on:
  pull_request:
    branches: [master]
    paths:
      - 'tools/lifeos_native_ui_finalize.py'
      - '.github/workflows/lifeos-native-ui-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/lifeos-native-ui-unification'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Finalize native UI migration
        run: python tools/lifeos_native_ui_finalize.py
      - name: Validate whitespace
        run: git diff --check
      - name: Commit finalizer changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No finalizer changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/app/pages/life-today-page/life-today-page.component.ts \
            src/app/pages/life-settings-page/life-settings-page.component.ts
          git commit -m 'fix(lifeos): finalize native UI markup'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
