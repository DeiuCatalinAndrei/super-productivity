name: Temp Format Networking

on:
  push:
    branches:
      - feat/networking-ui-polish-20260922

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/networking-ui-polish-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format Networking only
        run: npx prettier --write src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
      - name: Upload formatted Networking files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-networking
          path: |
            src/app/pages/networking-page/networking-page.component.ts
            src/app/features/networking/networking-today.component.ts
          retention-days: 1
