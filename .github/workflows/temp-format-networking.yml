name: Temp Format Networking

on:
  push:
    branches:
      - feat/networking-ui-polish-20260922

permissions:
  contents: write

concurrency:
  group: temp-format-networking
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/networking-ui-polish-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format Networking only
        run: npx prettier --write src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
      - name: Commit formatted Networking files through API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/networking-ui-polish-20260922
        shell: bash
        run: |
          set -euo pipefail
          for FILE in             src/app/pages/networking-page/networking-page.component.ts             src/app/features/networking/networking-today.component.ts
          do
            REMOTE_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${FILE}?ref=${BRANCH}" --jq .sha)
            CONTENT=$(base64 -w0 "${FILE}")
            gh api               --method PUT               "repos/${GITHUB_REPOSITORY}/contents/${FILE}"               -f message="style(networking): apply project formatting"               -f content="${CONTENT}"               -f sha="${REMOTE_SHA}"               -f branch="${BRANCH}" >/dev/null
          done
