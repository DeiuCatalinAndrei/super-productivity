name: Temp Format Networking

on:
  push:
    branches:
      - feat/networking-ui-polish-20260922

permissions:
  contents: write

concurrency:
  group: temp-format-networking
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/networking-ui-polish-20260922
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format Networking only
        run: npx prettier --write src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
      - name: Commit formatted Networking files
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts; then
            echo "Nothing to format"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
          git commit -m "style(networking): apply project formatting"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:feat/networking-ui-polish-20260922
