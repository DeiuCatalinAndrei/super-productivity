name: Format Networking Temp

on:
  push:
    branches: [feature/networking-native-ui-20260922]
    paths:
      - '.github/workflows/format-networking-temp.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/networking-native-ui-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format Networking only
        run: npx prettier --write src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-networking
          path: |
            src/app/pages/networking-page/networking-page.component.ts
            src/app/features/networking/networking-today.component.ts
          retention-days: 1
