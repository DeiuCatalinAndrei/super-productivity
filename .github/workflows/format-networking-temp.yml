name: Format Networking Temp

on:
  push:
    branches: [feature/networking-native-ui-20260922]
    paths:
      - '.github/workflows/format-networking-temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/networking-native-ui-20260922
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Format Networking only
        run: npx prettier --write src/app/pages/networking-page/networking-page.component.ts src/app/features/networking/networking-today.component.ts
      - name: Write formatted files through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feature/networking-native-ui-20260922
        shell: bash
        run: |
          set -euo pipefail

          update_file() {
            local file="$1"
            local sha
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$BRANCH" --jq .sha)

            FILE="$file" SHA="$sha" BRANCH="$BRANCH" python -c 'import os,base64,json; p=os.environ["FILE"]; c=base64.b64encode(open(p,"rb").read()).decode("ascii"); json.dump({"message":"style(networking): apply project formatting","branch":os.environ["BRANCH"],"sha":os.environ["SHA"],"content":c}, open("/tmp/networking-update.json","w",encoding="utf-8"))'

            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" \
              --input /tmp/networking-update.json >/dev/null
          }

          update_file "src/app/pages/networking-page/networking-page.component.ts"
          update_file "src/app/features/networking/networking-today.component.ts"
