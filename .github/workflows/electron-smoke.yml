name: Electron Packaging Smoke Test

# Validates the packaged Electron app — not just that sources compile.
#
# Catches bugs where code works at source level (tsc succeeds, `npm start`
# runs fine from loose files) but the production app.asar is missing a
# file that the main process require()s at startup. See #7320 for the
# motivating incident: electron/backup.ts imported from ../src/app/util/
# and the compiled dep was omitted from the electron-builder files glob,
# so every 18.2.7 binary crashed on launch.
#
# The static check catches missing require() targets. The packaged renderer
# also runs a task-create-and-reload flow under xvfb on every invocation, so
# pull requests prove the native shell can perform and persist a core action.

on:
  pull_request:
    branches: [master, main]
    # Trigger broadly — #7320's root cause was a file under src/app/util/
    # that electron/ imported, so narrowing to electron/** would have let
    # the exact bug this workflow exists to prevent slip through again.
    # Translation-only edits and non-code trees are excluded to keep
    # unrelated PRs cheap.
    paths:
      - '**'
      - '!docs/**'
      - '!**/*.md'
      - '!src/assets/i18n/**'
      - '!android/**'
      - '!ios/**'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/workflows/**'
      - '.github/workflows/electron-smoke.yml'
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-packaged-app:
    name: Linux Packaged Electron App
    runs-on: ubuntu-latest
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      - name: Install npm packages
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          # Retry to ride out transient npm registry flakiness. (Since
          # Electron 42 `npm i` no longer downloads the Electron binary;
          # electron-builder fetches its own copy at packaging time below.)
          command: npm i

      - run: npm run env

      - name: Build frontend (production es6)
        run: npm run buildFrontend:prod:es6
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Build electron main process
        run: npm run electron:build

      - name: Package electron app (linux dir, unpacked)
        # --linux dir produces linux-unpacked/ with the real app.asar but
        # skips AppImage/deb/snap/rpm — cheap and enough to exercise the
        # same packaging pipeline release uses.
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3
        with:
          timeout_minutes: 15
          max_attempts: 3
          retry_wait_seconds: 15
          shell: bash
          # Retry electron-builder's Electron zip download from GitHub
          # releases, which fails transiently now and then (e.g. EOF mid
          # download).
          command: npx electron-builder --linux dir --publish never

      - name: Verify require() targets in app.asar
        run: |
          ASAR=.tmp/app-builds/linux-unpacked/resources/app.asar
          if [ ! -f "$ASAR" ]; then
            echo "::error::Packaged app.asar not found at $ASAR"
            ls -la .tmp/app-builds/ || true
            exit 1
          fi
          node tools/verify-electron-requires.js "$ASAR"

      - name: Move packaged app into special-character path
        run: mv .tmp/app-builds/linux-unpacked '.tmp/app-builds/# packaged app'

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Smoke test packaged app task flow
        run: |
          set -o pipefail
          mkdir -p .tmp/smoke
          xvfb-run \
            --auto-servernum \
            --server-args="-screen 0 1280x720x24" \
            node e2e/electron/packaged-app-smoke.cjs \
              '.tmp/app-builds/# packaged app/superproductivity' \
            2>&1 | tee .tmp/smoke/launch.log

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-smoke-logs
          path: |
            .tmp/smoke/
            .tmp/app-builds/builder-debug.yml
            .tmp/app-builds/builder-effective-config.yaml
          retention-days: 7
          if-no-files-found: ignore

  windows-installer:
    name: Windows x64 Installer
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest
    env:
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
      UNSPLASH_CLIENT_ID: ${{ secrets.UNSPLASH_CLIENT_ID }}
    steps:
      - name: Set timezone
        shell: pwsh
        run: tzutil /s "W. Europe Standard Time"

      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Electron build environment
        uses: ./.github/actions/setup-electron-build

      - name: Match project npm version
        shell: pwsh
        run: npm.cmd install --global npm@11.18.0

      - name: Install npm packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "npm install attempt $attempt of 3"
            npm.cmd install @nx/nx-win32-x64-msvc
            if ($LASTEXITCODE -eq 0) {
              npm.cmd install
            }
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -lt 3) {
              Start-Sleep -Seconds 15
            }
          }
          Write-Error 'npm install failed after 3 attempts.'
          exit 1

      - name: Build Windows x64 installer
        shell: bash
        run: npm run buildFrontend:prod:es6 && npm run electron:build && npx electron-builder --win nsis --x64 --publish never

      - name: Verify x64 installer
        shell: pwsh
        run: |
          $installer = '.tmp/app-builds/Super-Productivity-Setup-x64.exe'
          if (!(Test-Path $installer)) {
            Write-Error "Windows x64 installer not found: $installer"
            Get-ChildItem '.tmp/app-builds' -Recurse | Select-Object FullName
            exit 1
          }

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: lifeos-windows-installer-${{ github.sha }}
          path: .tmp/app-builds/Super-Productivity-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
