name: Format LifeOS UX (temporary)

on:
  push:
    branches:
      - agent/lifeos-ux-polish-final
    paths:
      - '.github/workflows/build-windows-lifeos.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/lifeos-ux-polish-final
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install dependencies
        run: npm i
      - name: Format LifeOS UX files
        run: |
          npx prettier --write \
            src/app/app.routes.ts \
            src/app/core-ui/magic-side-nav/magic-nav-config.service.ts \
            src/app/core-ui/mobile-bottom-nav/mobile-bottom-nav.component.html \
            src/app/features/simple-counter/habit-tracker/habit-tracker.component.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.html \
            src/app/features/tasks/add-task-bar/add-task-bar.component.scss \
            src/app/pages/goals-page/goals-page.component.ts \
            src/app/pages/life-today-page/life-today-page.component.ts
      - name: Restore workflow files and commit formatting
        run: |
          git fetch origin master
          git checkout origin/master -- .github/workflows/build-windows-lifeos.yml
          rm -f .github/workflows/format-lifeos-ux.yml
          git config user.name 'OpenAI Agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/build-windows-lifeos.yml \
            .github/workflows/format-lifeos-ux.yml \
            src/app/app.routes.ts \
            src/app/core-ui/magic-side-nav/magic-nav-config.service.ts \
            src/app/core-ui/mobile-bottom-nav/mobile-bottom-nav.component.html \
            src/app/features/simple-counter/habit-tracker/habit-tracker.component.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.ts \
            src/app/features/tasks/add-task-bar/add-task-bar.component.html \
            src/app/features/tasks/add-task-bar/add-task-bar.component.scss \
            src/app/pages/goals-page/goals-page.component.ts \
            src/app/pages/life-today-page/life-today-page.component.ts
          git commit -m 'style(lifeos): format UX updates'
          git push origin HEAD:agent/lifeos-ux-polish-final
