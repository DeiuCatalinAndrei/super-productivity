name: Temporary LifeOS dependency hardening

on:
  push:
    branches:
      - fix/release-hardening-20260825
    paths:
      - .github/workflows/tmp-lifeos-security-audit.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Match project npm version
        run: npm install --global npm@11.18.0
      - name: Apply patch-only dependency security updates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const angular = [
            '@angular-devkit/build-angular',
            '@angular/animations',
            '@angular/cli',
            '@angular/common',
            '@angular/compiler',
            '@angular/compiler-cli',
            '@angular/core',
            '@angular/forms',
            '@angular/language-service',
            '@angular/platform-browser',
            '@angular/platform-browser-dynamic',
            '@angular/platform-server',
            '@angular/router',
            '@angular/service-worker',
            '@schematics/angular',
          ];
          for (const name of angular) p.devDependencies[name] = '^21.2.21';
          p.devDependencies['@angular/cdk'] = '^21.2.14';
          p.devDependencies['@angular/material'] = '^21.2.14';
          p.devDependencies['electron-builder'] = '^26.15.3';
          p.overrides['@angular/build'] = { undici: '7.29.0' };
          p.overrides['node-gyp'] = { undici: '6.28.0' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Refresh lockfile as a coordinated patch set
        run: npm install --package-lock-only --ignore-scripts --legacy-peer-deps
      - name: Reconcile peer dependencies with the normal resolver
        run: npm install --ignore-scripts
      - name: Apply non-breaking npm audit fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true
      - name: Reconcile audit-fix lockfile
        run: npm install --ignore-scripts
      - name: Validate clean install with the normal resolver
        run: npm ci --ignore-scripts
      - name: Runtime dependency audit
        run: npm audit --omit=dev --json
      - name: Full dependency audit
        run: npm audit --json || true
      - name: Commit dependency hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
            exit 0
          fi
          git commit -m "chore: patch vulnerable build dependencies"
          git fetch origin fix/release-hardening-20260825
          git rebase origin/fix/release-hardening-20260825
          git push origin HEAD:fix/release-hardening-20260825
