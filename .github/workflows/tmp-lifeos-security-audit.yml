name: Temporary LifeOS dependency hardening

on:
  push:
    branches:
      - fix/release-hardening-20260825
    paths:
      - .github/workflows/tmp-lifeos-security-audit.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Match project npm version
        run: npm install --global npm@11.18.0
      - name: Apply patch-only dependency security updates
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const angular = [
            '@angular-devkit/build-angular',
            '@angular/animations',
            '@angular/cli',
            '@angular/common',
            '@angular/compiler',
            '@angular/compiler-cli',
            '@angular/core',
            '@angular/forms',
            '@angular/language-service',
            '@angular/platform-browser',
            '@angular/platform-browser-dynamic',
            '@angular/platform-server',
            '@angular/router',
            '@angular/service-worker',
            '@schematics/angular',
          ];
          for (const name of angular) p.devDependencies[name] = '^21.2.21';
          p.devDependencies['@angular/cdk'] = '^21.2.14';
          p.devDependencies['@angular/material'] = '^21.2.14';
          p.devDependencies['electron-builder'] = '^26.15.3';
          p.overrides['@angular/build'] = { undici: '7.29.0' };
          p.overrides['node-gyp'] = { undici: '6.28.0' };
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
          NODE
      - name: Refresh targeted lockfile entries without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts --save-dev \
            @angular-devkit/build-angular@21.2.21 \
            @angular/animations@21.2.21 \
            @angular/cli@21.2.21 \
            @angular/common@21.2.21 \
            @angular/compiler@21.2.21 \
            @angular/compiler-cli@21.2.21 \
            @angular/core@21.2.21 \
            @angular/forms@21.2.21 \
            @angular/language-service@21.2.21 \
            @angular/platform-browser@21.2.21 \
            @angular/platform-browser-dynamic@21.2.21 \
            @angular/platform-server@21.2.21 \
            @angular/router@21.2.21 \
            @angular/service-worker@21.2.21 \
            @schematics/angular@21.2.21 \
            @angular/cdk@21.2.14 \
            @angular/material@21.2.14 \
            electron-builder@26.15.3
      - name: Runtime dependency audit
        run: npm audit --omit=dev --json
      - name: Full dependency audit
        run: npm audit --json || true
      - name: Commit dependency hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore: patch vulnerable build dependencies"
            git push origin HEAD:fix/release-hardening-20260825
          fi
