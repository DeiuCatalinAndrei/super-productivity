name: Agent Unit Diagnose

on:
  push:
    branches:
      - fix/lifeos-duplicate-repeat

permissions:
  contents: read

jobs:
  unit-diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies quietly
        shell: bash
        run: |
          set +e
          npm i > /tmp/install.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== npm install failure ==='
            tail -n 120 /tmp/install.log
            exit "$status"
          fi
      - name: Generate environment
        run: npm run env
      - name: Run unit suite with compact failure output
        shell: bash
        run: |
          set +e
          npm run test > /tmp/unit.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo 'Unit suite passed.'
            exit 0
          fi

          echo '=== UNIT TEST FAILURE SUMMARY ==='
          grep -Ein -B 8 -A 25 'FAIL|FAILED|AssertionError|Expected|expected|Error:|TypeError|ReferenceError|Test Suites|Tests:|✘|×' /tmp/unit.log | tail -n 260 || true
          echo '=== UNIT TEST LOG TAIL ==='
          tail -n 160 /tmp/unit.log
          exit "$status"
